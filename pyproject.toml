[project]
name = "tutor-backend"
version = "1.0.0"
description = "FastAPI + PostgreSQL backend completo para plataforma de questionários com tutor IA e RBAC."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-dotenv>=1.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "SQLAlchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
  "httpx>=0.27",
  "tenacity>=8.2",
  "python-multipart>=0.0.9",
  "orjson>=3.9",
  "anyio>=4.0.0",
  "cachetools>=5.3.0",
  "scikit-learn>=1.4",
  "email-validator>=2.1",
  "PyYAML>=6.0",
  "redis>=5.0.0",
  "aiosmtplib>=3.0.0",
  "gunicorn>=21.0.0",
]
readme = "README.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
