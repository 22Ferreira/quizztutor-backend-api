stages:
  - deploy

deploy_producao:
  stage: deploy
  image: alpine:latest
  rules:
    # Desativado a pedido: deploy está sendo feito manualmente na VPS por
    # enquanto. Pra reativar, troque a linha abaixo de volta para:
    #   - if: '$CI_COMMIT_BRANCH == "producao"'
    - when: never
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh "$VPS_USER@$VPS_HOST"
      "cd quiztutor-platform &&
      git pull origin producao &&
      docker compose -f docker-compose.prod.yml up -d --build &&
      docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head"
